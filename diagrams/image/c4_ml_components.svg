<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="553" viewBox="0 0 1650 760" role="img" aria-labelledby="title desc"><title id="title">C4 components of the fraud scoring service</title><desc id="desc">Components inside the fraud scoring service: adapter, validation, feature builder, model loader, scorer, policy and publisher.</desc><defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0 L10 3.5 L0 7Z" fill="#475569"/></marker><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:25px;font-weight:bold}.boundary{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.component{fill:#fff;stroke:#2563eb;stroke-width:2}.external{fill:#f8fafc;stroke:#64748b;stroke-width:2}.store{fill:#ecfdf5;stroke:#059669;stroke-width:2}.head{font-size:16px;font-weight:bold}.small{font-size:14px}.line{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs><text class="title" x="825" y="38" text-anchor="middle">C4 Components: fraud scoring service</text><rect class="boundary" x="130" y="100" width="1390" height="460" rx="10"/><text class="head" x="155" y="132">Fraud scoring service</text><rect class="component" x="175" y="250" width="145" height="90" rx="7"/><text class="head" x="247" y="280" text-anchor="middle">Score request</text><text class="head" x="247" y="300" text-anchor="middle">adapter</text><text class="small" x="247" y="321" text-anchor="middle">accepts request</text><rect class="component" x="375" y="250" width="145" height="90" rx="7"/><text class="head" x="447" y="280" text-anchor="middle">Schema validator</text><text class="small" x="447" y="310" text-anchor="middle">rejects incomplete data</text><rect class="component" x="575" y="250" width="155" height="90" rx="7"/><text class="head" x="652" y="280" text-anchor="middle">Feature builder</text><text class="small" x="652" y="310" text-anchor="middle">normalizes and enriches</text><rect class="component" x="785" y="250" width="145" height="90" rx="7"/><text class="head" x="857" y="280" text-anchor="middle">Model version</text><text class="head" x="857" y="300" text-anchor="middle">loader</text><text class="small" x="857" y="321" text-anchor="middle">reads active manifest</text><rect class="component" x="985" y="250" width="145" height="90" rx="7"/><text class="head" x="1057" y="280" text-anchor="middle">Gradient boosting</text><text class="head" x="1057" y="300" text-anchor="middle">scorer</text><text class="small" x="1057" y="321" text-anchor="middle">fraud probability</text><rect class="component" x="1185" y="250" width="145" height="90" rx="7"/><text class="head" x="1257" y="280" text-anchor="middle">Decision policy</text><text class="small" x="1257" y="310" text-anchor="middle">threshold and reason</text><rect class="component" x="1380" y="250" width="115" height="90" rx="7"/><text class="head" x="1437" y="280" text-anchor="middle">Result</text><text class="head" x="1437" y="300" text-anchor="middle">publisher</text><rect class="external" x="30" y="260" width="80" height="70" rx="7"/><text class="head" x="70" y="288" text-anchor="middle">Payment</text><text class="small" x="70" y="307" text-anchor="middle">API</text><rect class="external" x="530" y="620" width="170" height="74" rx="7"/><text class="head" x="615" y="650" text-anchor="middle">Feature service</text><text class="small" x="615" y="672" text-anchor="middle">profile and device signals</text><rect class="store" x="785" y="620" width="160" height="74" rx="7"/><text class="head" x="865" y="650" text-anchor="middle">Model registry</text><text class="small" x="865" y="672" text-anchor="middle">artifact and version</text><rect class="store" x="1360" y="620" width="160" height="74" rx="7"/><text class="head" x="1440" y="650" text-anchor="middle">Kafka</text><text class="small" x="1440" y="672" text-anchor="middle">score event</text><path class="line" d="M110 295H175 M320 295H375 M520 295H575 M730 295H785 M930 295H985 M1130 295H1185 M1330 295H1380"/><path class="line" d="M615 620V340"/><text class="small" x="653" y="505">signals</text><path class="line" d="M865 620V340"/><text class="small" x="906" y="505">model artifact</text><path class="line" d="M1437 340V620"/><text class="small" x="1470" y="505">score and version</text><text class="small" x="957" y="278" text-anchor="middle">model</text><text class="small" x="155" y="735">Only the ML container is decomposed here; other containers remain intentionally outside this C4 level.</text></svg>
